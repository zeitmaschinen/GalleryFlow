name: Create Release Package

on:
  # Runs automatically when a release is published on GitHub
  release:
    types: [published]
  # Lets you run it by hand from the Actions tab, e.g. to add the zip to an existing release
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach the zip to (for example v2.0.0)'
        required: true

# Needed so the workflow may upload the zip to the release
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      # Build the ZIP, leaving out files end users don't need
      - name: Create ZIP package
        run: |
          zip -r "galleryflow-${TAG}.zip" \
          . \
          -x "node_modules/*" \
          -x "*/node_modules/*" \
          -x "build/*" \
          -x "dist/*" \
          -x "frontend/build/*" \
          -x "frontend/dist/*" \
          -x "backend/build/*" \
          -x "backend/dist/*" \
          -x ".env" \
          -x ".DS_Store" \
          -x "Thumbs.db" \
          -x "*.log" \
          -x ".idea/*" \
          -x ".vscode/*" \
          -x "*.sublime-workspace" \
          -x "*.sublime-project" \
          -x "__pycache__/*" \
          -x "*/__pycache__/*" \
          -x "*.py[cod]" \
          -x "coverage/*" \
          -x "*.snap" \
          -x "*.db" \
          -x ".git/*" \
          -x ".github/*"

      # Attach the ZIP to the release
      - name: Upload Release Asset
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          files: galleryflow-${{ env.TAG }}.zip
